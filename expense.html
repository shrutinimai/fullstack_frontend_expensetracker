<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expense.css">
    <script src="auth-check.js"></script>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Add Expense</h2>
    <form id="expenseForm">
        <label>Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount" required><br>

        <label>Description:</label>
        <input type="text" id="description" placeholder="Enter description" required><br>

        <label>Category:</label>
        <select id="category" required>
            <option value="Food">Food</option>
            <option value="Fuel">Fuel</option>
            <option value="Electricity">Electricity</option>
            <option value="Movie">Movie</option>
        </select><br>

        <button type="submit">Add Expense</button>
    </form>

    <h3>Expenses:</h3>

    <div id="premiumStatus" style="margin-bottom: 10px; font-weight: bold; color: green;"></div>

    <ul id="expensesList"></ul>
    
<h2 id="premium-banner" style="display:none; color:green;"></h2>


</div>
<button id="leaderboard-btn" style="display:none;">Show Leaderboard</button>
<div id="leaderboard-list"></div>

<button id="buyPremiumBtn" style="position: absolute; right: 20px; top: 20px;">
    Buy Premium Membership 
</button>

<div id="paymentMessage" style="display: none; padding: 10px; margin-top: 10px;"></div>

<script src="script.js"></script>
<script src="payment.js"></script>

<script>
    
    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("order_id");
    
        if (orderId) {
            try {
                const token = localStorage.getItem("token");
    
                const response = await fetch(`http://localhost:4200/order/success?order_id=${orderId}`, {
                    method: 'GET',
                    headers: { 'Authorization': token }
                });
    
                if (response.ok) {
                    console.log("Premium activated.");

                    const msgDiv = document.getElementById("paymentMessage");
                    msgDiv.textContent = " Payment successful! Premium Activated!.";
                    msgDiv.style.display = "block";
                    msgDiv.style.color = "green";

                    fetchExpenses();  
                }
            } catch (err) {
                console.error("Error confirming payment:", err);
            }
        }
    
        await fetchExpenses(); // Only called here, not in script.js anymore
    });
    
    </script>

</body>
</html>
